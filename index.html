<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <link
      rel="icon"
      type="image/svg+xml"
      href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" rx="12" fill="%23141d18"/%3E%3Cpath d="M6 52 25 22l9 14 7-10 17 26Z" fill="%23cc9a4d"/%3E%3Cpath d="m25 22 5 8-4 2-4-5Z" fill="%23f3e7d2"/%3E%3Cpath d="M6 52h52" stroke="%23b8482f" stroke-width="4" stroke-linecap="round"/%3E%3C/svg%3E'
    />
    <title> पहाड़ की धुन</title>
    <meta
      name="description"
      content="Classic Kumaoni songs — a living radio archive for Kumaoni memories, melodies and mountain evenings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,600&family=Tiro+Devanagari+Hindi&family=Work+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #141d18;
        --panel: #22302a;
        --geru: #b8482f;
        --geru-soft: rgba(184, 72, 47, 0.5);
        --brass: #cc9a4d;
        --biswar: #f3e7d2;
        --text: #f3e7d2;
        --text-dim: rgba(243, 231, 210, 0.8);
        --text-muted: rgba(243, 231, 210, 0.6);
        --line: rgba(243, 231, 210, 0.14);
        --max: 1100px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        color: var(--text);
        font-family: "Work Sans", system-ui, sans-serif;
        overflow-x: hidden;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      ::selection {
        background: var(--geru);
        color: var(--biswar);
      }

      .bg-container {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-image {
        position: absolute;
        width: 110%;
        height: 110%;
        top: -5%;
        left: -5%;
        object-fit: cover;
        filter: brightness(0.62) saturate(2) contrast(0.79);
        transition: transform 0.1s ease-out;
        will-change: transform;
      }
      .bg-bottom-gradient {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 45%;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.92) 0%,
          rgba(24, 22, 22, 0) 100%
        );
        pointer-events: none;
        z-index: 1;
      }
      .main-content {
        position: relative;
        z-index: 3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        background: linear-gradient(
          to bottom,
          rgba(10, 15, 12, 0.65) 0%,
          rgba(10, 15, 12, 0) 100%
        );
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Fraunces", serif;
        font-size: 17px;
        font-weight: 600;
        font-style: italic;
        color: var(--text);
        text-decoration: none;
        letter-spacing: -0.2px;
      }

      .top-right {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .top-status {
        display: flex;
        align-items: center;
        gap: 26px;
        color: var(--text-muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        font-weight: 500;
      }
      .live-indicator {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--brass);
      }
      .live-pulse {
        width: 5px;
        height: 5px;
        background: var(--geru);
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 0 8px rgba(184, 72, 47, 0.6);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      .indian-time {
        font-family: "Space Mono", monospace;
        font-size: 13px;

        letter-spacing: 0.05em;
        font-weight: 600;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      }
      .listeners {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "Space Mono", monospace;
        font-size: 10px;
        color: var(--text-dim);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      }
      .listeners-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--brass);
      }

      .playlist-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 16px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--biswar);
        font-family: "Work Sans", sans-serif;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .playlist-toggle:hover {
        border-color: var(--geru);
        background: rgba(184, 72, 47, 0.1);
        color: var(--brass);
      }
      .playlist-toggle .bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        width: 12px;
        height: 11px;
      }
      .playlist-toggle .bars span {
        flex: 1;
        background: currentColor;
      }
      .playlist-toggle .bars span:nth-child(1) {
        height: 45%;
      }
      .playlist-toggle .bars span:nth-child(2) {
        height: 100%;
      }
      .playlist-toggle .bars span:nth-child(3) {
        height: 65%;
      }

      .hero-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 130px 40px 90px;
        position: relative;
        z-index: 3;
      }
      .hero-ornament {
        width: 56px;
        height: 56px;
        opacity: 0.75;
        margin-bottom: 24px;
        animation: spin-slow 60s linear infinite;
      }
      @keyframes spin-slow {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .hero-eyebrow {
        font-weight: 900;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.16em;

        color: var(--brass);
        margin: 0px 0 8px 0;

        font-weight: 500;
      }
      .hero-title {
        font-family: "Fraunces", serif;
        font-size: clamp(58px, 10vw, 140px);
        font-weight: 900;
        font-style: italic;
        line-height: 0.84;
        letter-spacing: -0.03em;
        color: var(--biswar);
        margin: 8px;
        text-shadow: 0 4px 40px rgba(0, 0, 0, 0.7);
      }
      .hero-subtitle {
        font-family: "Tiro Devanagari Hindi", serif;
        font-size: clamp(29px, 5vw, 70px);
        font-weight: 400;
        line-height: 1.2;
        color: var(--brass);
        margin: 24px 0 22px 0;
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.7);
      }
      .hero-tags {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
        justify-content: center;
        margin-bottom: 8px;
      }
      .tag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.11em;
        color: var(--text-dim);
        font-weight: 500;
      }
      .tag-dot {
        width: 3px;
        height: 3px;
        background: var(--geru-soft);
        border-radius: 50%;
      }

      /* --- PLAYLIST DRAWER --- */
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 6, 5, 0.55);
        backdrop-filter: blur(2px);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .playlist-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        height: 100dvh;
        width: min(420px, 88vw);
        background: #10160f;
        border-left: 1px solid var(--line);
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        box-shadow: -30px 0 60px rgba(0, 0, 0, 0.5);
      }
      .playlist-drawer.open {
        transform: translateX(0);
      }
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 24px 18px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .drawer-header h2 {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 600;
        font-style: italic;
        color: var(--biswar);
      }
      .drawer-header .sub {
        font-family: "Space Mono", monospace;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--brass);
        margin-top: 4px;
      }
      .drawer-close {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 14px;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }
      .drawer-close:hover {
        border-color: var(--geru);
        color: var(--brass);
      }
      .track-list {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1;
        min-height: 0;
        padding-bottom: 110px;
      }
      .track-row {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 16px 24px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        background: transparent;
        transition: background 0.25s ease;
      }
      .track-row:first-child {
        border-top: none;
      }
      .track-row:hover {
        background: rgba(243, 231, 210, 0.03);
      }
      .track-row.active {
        background: rgba(184, 72, 47, 0.1);
      }
      .track-num {
        font-family: "Space Mono", monospace;
        font-size: 11px;
        color: var(--text-muted);
      }
      .track-row.active .track-num {
        color: var(--geru);
      }
      .track-main {
        min-width: 0;
      }
      .track-main .t-title {
        font-family: "Tiro Devanagari Hindi", serif;
        font-size: 17px;
        color: var(--biswar);
        font-weight: 400;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track-row.active .t-title {
        color: var(--brass);
      }
      .track-main .t-meta {
        margin-top: 4px;
        font-family: "Space Mono", monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .track-eq {
        width: 14px;
        height: 12px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        opacity: 0;
        flex-shrink: 0;
      }
      .track-row.active .track-eq {
        opacity: 1;
      }
      .track-eq span {
        flex: 1;
        background: var(--geru);
        animation: eq 1s ease-in-out infinite;
      }
      .track-eq span:nth-child(1) {
        height: 40%;
        animation-delay: 0s;
      }
      .track-eq span:nth-child(2) {
        height: 100%;
        animation-delay: 0.2s;
      }
      .track-eq span:nth-child(3) {
        height: 65%;
        animation-delay: 0.4s;
      }
      @keyframes eq {
        0%,
        100% {
          transform: scaleY(0.4);
        }
        50% {
          transform: scaleY(1);
        }
      }

      /* --- PLAYER --- */
      .player {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(620px, calc(100% - 32px));
        z-index: 20;
      }
      .player-inner {
        background: linear-gradient(
          180deg,
          rgba(24, 32, 27, 0.97),
          rgba(14, 19, 16, 0.97)
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(204, 154, 77, 0.28);
        border-top: 2px solid var(--brass);
        border-radius: 16px;
        box-shadow:
          0 25px 55px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }
      .player-body {
        padding: 14px 18px 16px;
      }
      .player-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 14px;
        align-items: center;
      }
      /* rotating brass disc — spins while a track plays, still while paused */
      .player-disc {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        flex-shrink: 0;
        background:
          radial-gradient(circle at center, var(--bg) 0 6px, transparent 6.5px),
          repeating-conic-gradient(
            from 0deg,
            var(--brass) 0deg 6deg,
            #7a5a2c 6deg 12deg
          );
        border: 1px solid rgba(204, 154, 77, 0.5);
        box-shadow:
          inset 0 0 10px rgba(0, 0, 0, 0.5),
          0 2px 8px rgba(0, 0, 0, 0.4);
        animation: discSpin 6s linear infinite;
        animation-play-state: paused;
      }
      .player-disc.spinning {
        animation-play-state: running;
      }
      @keyframes discSpin {
        to {
          transform: rotate(360deg);
        }
      }
      .player-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ctrl-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--text-dim);
        transition: all 0.2s ease;
        font-size: 11px;
        background: rgba(243, 231, 210, 0.04);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .ctrl-btn:hover {
        border-color: var(--brass);
        color: var(--biswar);
        background: rgba(204, 154, 77, 0.12);
      }
      .ctrl-btn.play-btn {
        width: 44px;
        height: 44px;
        background: var(--geru);
        color: var(--biswar);
        border: 2px solid var(--brass);
        font-size: 13px;
        font-weight: 600;
      }
      .ctrl-btn.play-btn:hover {
        background: #cc5637;
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(184, 72, 47, 0.45);
      }
      .track-info {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .track-text {
        min-width: 0;
      }
      .track-title {
        font-family: "Fraunces", serif;
        font-size: 15px;
        font-weight: 500;
        font-style: italic;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--biswar);
      }
      .track-meta {
        margin-top: 4px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--brass);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-time {
        font-size: 10px;
        color: var(--text-dim);
        white-space: nowrap;
        font-family: "Space Mono", monospace;
        flex-shrink: 0;
      }
      .player-time .divider,
      .player-time .duration {
        color: var(--text-muted);
      }
      .progress-row {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .progress-wrap {
        flex: 1;
        height: 4px;
        background: var(--line);
        border-radius: 3px;
        overflow: visible;
        cursor: pointer;
        position: relative;
      }
      .progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, var(--geru), var(--brass));
        border-radius: 3px;
        transition: width 0.3s linear;
        box-shadow: 0 0 10px rgba(204, 154, 77, 0.5);
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        right: -4px;
        top: 50%;
        width: 9px;
        height: 9px;
        transform: translateY(-50%) rotate(45deg);
        background: var(--brass);
        border-radius: 2px;
        box-shadow: 0 0 6px rgba(204, 154, 77, 0.7);
      }
      .vol-btn-wrap {
        flex-shrink: 0;
      }
      .vol-btn {
        font-size: 13px;
      }
      .vol-btn.active {
        border-color: var(--brass);
        color: var(--brass);
        background: rgba(204, 154, 77, 0.12);
      }
      .vol-wrap {
        position: absolute;
        right: 18px;
        bottom: calc(100% + 10px);
        display: flex;
        align-items: center;
        gap: 10px;
        width: 170px;
        max-width: calc(100vw - 36px);
        padding: 10px 14px;
        background: linear-gradient(
          180deg,
          rgba(24, 32, 27, 0.98),
          rgba(14, 19, 16, 0.98)
        );
        border: 1px solid rgba(204, 154, 77, 0.28);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transform: translateY(6px);
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
        z-index: 25;
        overflow: hidden;
        box-sizing: border-box;
      }
      .vol-wrap.open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      .vol-label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      /* Improved Volume Slider */
      #volume {
        flex: 1;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--geru), var(--brass));
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #volume:hover {
        height: 8px;
      }

      #volume::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--biswar);
        border: 3px solid var(--brass);
        box-shadow: 0 0 10px rgba(204, 154, 77, 0.6);
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      #volume::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      #volume::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--geru), var(--brass));
      }

      #volume::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--biswar);
        border: 3px solid var(--brass);
        box-shadow: 0 0 10px rgba(204, 154, 77, 0.6);
        cursor: pointer;
      }
      #youtube {
        position: fixed;
        width: 1px;
        height: 1px;
        left: -100px;
        bottom: -100px;
        opacity: 0.01;
        pointer-events: none;
      }
      .rewind-overlay {
        position: fixed;
        inset: 0;
        background: rgba(184, 72, 47, 0.25);
        pointer-events: none;
        opacity: 0;
        z-index: 200;
      }
      .rewind-overlay.active {
        animation: rewindFlash 0.5s ease;
      }
      @keyframes rewindFlash {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
        }
      }

      /* --- Responsive breakpoints --- */
      @media (max-width: 900px) {
        .playlist-drawer {
          width: min(380px, 82vw);
        }
        .player {
          width: min(560px, calc(100% - 24px));
        }
      }

      @media (max-width: 640px) {
        .topbar {
          padding: 0 16px;
          height: 60px;
        }
        .top-status span:nth-child(2) {
          display: none;
        }
        .listeners {
          display: none;
        }
        .playlist-toggle {
          padding: 8px 12px;
        }
        .hero-center {
          padding: 90px 20px 70px;
        }
        .hero-tags {
          gap: 10px;
        }
        .player {
          width: calc(100% - 16px);
          bottom: 10px;
        }
        .player-body {
          padding: 12px 14px 14px;
        }
        .player-row {
          gap: 10px;
        }
        .player-disc {
          width: 36px;
          height: 36px;
        }
        .track-title {
          font-size: 13px;
        }
        .track-meta {
          font-size: 8px;
        }
        .player-time {
          font-size: 9px;
        }
        .ctrl-btn {
          width: 32px;
          height: 32px;
          font-size: 10px;
        }
        .ctrl-btn.play-btn {
          width: 40px;
          height: 40px;
        }
        .playlist-drawer {
          width: 100vw;
        }
        .drawer-header {
          padding: 18px 18px 14px;
        }
        .drawer-header h2 {
          font-size: 19px;
        }
        .track-row {
          padding: 13px 18px;
          gap: 10px;
        }
        .track-main .t-title {
          font-size: 15px;
        }
        .playlist-toggle span.label {
          display: none;
        }
      }

      @media (max-width: 380px) {
        .topbar {
          padding: 0 12px;
        }
        .indian-time {
          font-size: 11px;
        }
        .hero-center {
          padding: 80px 14px 60px;
        }
        .player {
          width: calc(100% - 10px);
          bottom: 6px;
        }
        .player-row {
          grid-template-columns: auto 1fr auto;
          gap: 8px;
        }
        .player-controls {
          gap: 5px;
        }
        .prev-btn-label,
        .track-meta {
          display: none;
        }
        .vol-wrap {
          width: 140px;
        }
        .track-row {
          grid-template-columns: 24px 1fr auto;
          padding: 12px 14px;
        }
      }

      @media (max-height: 480px) and (orientation: landscape) {
        .drawer-header {
          padding: 14px 20px 10px;
        }
        .track-row {
          padding: 10px 20px;
        }
        .player {
          bottom: 6px;
        }
      }

      @media (max-width: 340px) {
        .player-disc {
          display: none;
        }
        .player-body {
          padding: 10px 12px 12px;
        }
        .player-time {
          font-size: 8px;
        }
        .track-title {
          font-size: 12px;
        }
        .ctrl-btn {
          width: 30px;
          height: 30px;
        }
        .ctrl-btn.play-btn {
          width: 38px;
          height: 38px;
        }
        .vol-wrap {
          right: 10px;
          width: 130px;
          padding: 8px 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
        .bg-image {
          transition: none !important;
        }
        .playlist-drawer,
        .drawer-backdrop {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-container" id="bgContainer">
      <img
        class="bg-image"
        id="bgImage"
        src="hill2.png"
        alt="Green terraced hills of the Uttarakhand Himalayas"
        loading="lazy"
      />
      <div class="bg-bottom-gradient"></div>
    </div>
    <div class="rewind-overlay" id="rewindOverlay"></div>

    <div class="main-content">
      <header class="topbar">
        <a href="#" class="brand">
          <span class="indian-time" id="clock">00:00 AM</span>
        </a>
        <div class="top-right">
          <div class="top-status">
            <span class="listeners"
              ><span class="listeners-dot"></span
              ><span id="listenerCount">—</span> listening</span
            >
          </div>
          <button
            class="playlist-toggle"
            id="playlistToggle"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span class="bars"><span></span><span></span><span></span></span>
            <span class="label">Playlist</span>
          </button>
        </div>
      </header>

      <section class="hero-center">
        <h1 class="hero-title">देवभूमि</h1>
        <p class="hero-subtitle">रेडियो</p>
      </section>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="playlist-drawer" id="playlistDrawer" aria-label="Playlist">
      <div class="drawer-header">
        <div>
          <h2>आज की सूची</h2>
          <div class="sub" id="drawerSub">30 songs · tap to play</div>
        </div>
        <button
          class="drawer-close"
          id="drawerClose"
          aria-label="Close playlist"
        >
          ✕
        </button>
      </div>
      <div class="track-list" id="trackList"></div>
    </aside>

    <div class="player">
      <div class="player-inner">
        <div class="player-body">
          <div class="player-row">
            <div class="player-controls">
              <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
                ◀◀
              </button>
              <button
                class="ctrl-btn play-btn"
                id="playBtn"
                aria-label="Play/Pause"
              >
                ▶
              </button>
              <button class="ctrl-btn" id="nextBtn" aria-label="Next">
                ▶▶
              </button>
            </div>
            <div class="track-info">
              <div class="player-disc" id="playerDisc" aria-hidden="true"></div>
              <div class="track-text">
                <div class="track-title" id="songTitle">
                  loading....
                </div>
                <div class="track-meta" id="songStatus">
                   ready to play
                </div>
              </div>
            </div>
            <div class="player-time" id="playerTime">
              <span class="current">00:00</span><span class="divider"> / </span
              ><span class="duration" id="durationTime">00:00</span>
            </div>
          </div>
          <div class="progress-row">
            <div
              class="progress-wrap"
              id="progress"
              role="slider"
              aria-label="Track progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="vol-btn-wrap">
              <button
                class="ctrl-btn vol-btn"
                id="volBtn"
                aria-label="Volume"
                aria-haspopup="true"
                aria-expanded="false"
              >
                🔊
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="vol-wrap" id="volWrap">
        <span class="vol-label">Vol</span>
        <input
          type="range"
          id="volume"
          min="0"
          max="100"
          value="80"
          aria-label="Volume"
        />
      </div>
    </div>
    <iframe
      id="youtube"
      src="https://www.youtube.com/embed/Yq4GkZAxWQw?enablejsapi=1&playsinline=1&controls=0&rel=0&modestbranding=1"
      allow="autoplay; encrypted-media"
      title="Kumaoni music player"
    ></iframe>

    <script>
      (function () {
        const bgImage = document.getElementById("bgImage");
        const moveFactor = 20;
        function handleMouseMove(e) {
          if (!bgImage) return;
          const vw = window.innerWidth,
            vh = window.innerHeight;
          const mouseX = e.clientX / vw - 0.5,
            mouseY = e.clientY / vh - 0.5;
          bgImage.style.transform = `translate(${mouseX * moveFactor * -1}px, ${mouseY * moveFactor * -1}px)`;
        }
        function handleMouseLeave() {
          if (bgImage) bgImage.style.transform = "translate(0px,0px)";
        }
        window.addEventListener("mousemove", handleMouseMove);
        document.body.addEventListener("mouseleave", handleMouseLeave);
      })();

      const clockEl = document.getElementById("clock");
      function updateClock() {
        const now = new Date();
        const indiaTime = new Date(
          now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }),
        );
        let hours = indiaTime.getHours();
        const minutes = indiaTime.getMinutes(),
          seconds = indiaTime.getSeconds();
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        hours = hours ? hours : 12;
        clockEl.textContent = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")} ${ampm} `;
      }
      updateClock();
      setInterval(updateClock, 1000);

      /* Simulated "listening now" counter — decorative only.
       This is a static HTML file with no server, so it has no real way to
       know how many people currently have the page open — a true live count
       needs a backend with presence tracking (e.g. Firebase/Supabase), which
       wasn't set up here. This number gently drifts to give the "on air"
       feeling, but it is NOT a real visitor count. */
      const listenerEl = document.getElementById("listenerCount");
      let listeners = 20 + Math.floor(Math.random() * 15);
      function driftListeners() {
        listeners += Math.floor(Math.random() * 5) - 2;
        listeners = Math.max(6, Math.min(48, listeners));
        listenerEl.textContent = listeners;
      }
      driftListeners();
      setInterval(driftListeners, 4000);

      let playerReady = false,
        isPlaying = false,
        currentTime = 0,
        duration = 180,
        progressInterval = null;

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document
        .getElementsByTagName("script")[0]
        .parentNode.insertBefore(
          tag,
          document.getElementsByTagName("script")[0],
        );

      let ytPlayer;
      function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player("youtube", {
          events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange,
          },
        });
      }
      function onPlayerReady() {
        playerReady = true;
        document.getElementById("songStatus").textContent =
          " ready to play";
        ytPlayer.setVolume(Number(volumeSlider.value));
        duration = ytPlayer.getDuration() || 180;
        updateDurationLabel();
        updateSongLabel();
      }
      function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          isPlaying = true;
          updatePlayButton();
          document.getElementById("songStatus").textContent =
            " playing";
          duration = ytPlayer.getDuration() || duration;
          updateDurationLabel();
          startProgressTracking();
        } else if (event.data === YT.PlayerState.PAUSED) {
          isPlaying = false;
          updatePlayButton();
          document.getElementById("songStatus").textContent =
            " paused";
          stopProgressTracking();
        } else if (event.data === YT.PlayerState.ENDED) {
          isPlaying = false;
          updatePlayButton();
          document.getElementById("songStatus").textContent =
            " ended";
          stopProgressTracking();
          setTimeout(() => nextTrack(), 1000);
        }
      }
      function startProgressTracking() {
        stopProgressTracking();
        progressInterval = setInterval(() => {
          if (ytPlayer && playerReady && isPlaying) {
            currentTime = ytPlayer.getCurrentTime() || 0;
            duration = ytPlayer.getDuration() || duration;
            if (duration > 0) {
              const percent = (currentTime / duration) * 100;
              document.getElementById("progressBar").style.width =
                percent + "%";
              document
                .getElementById("progress")
                .setAttribute("aria-valuenow", percent.toFixed(1));
              document.querySelector("#playerTime .current").textContent =
                formatTime(currentTime);
              updateDurationLabel();
            }
          }
        }, 200);
      }
      function stopProgressTracking() {
        if (progressInterval) {
          clearInterval(progressInterval);
          progressInterval = null;
        }
      }
      function formatTime(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        const minutes = Math.floor(seconds / 60),
          secs = seconds % 60;
        return (
          String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0")
        );
      }
      function updateDurationLabel() {
        const durationEl = document.getElementById("durationTime");
        if (durationEl) durationEl.textContent = formatTime(duration);
      }

      const playBtn = document.getElementById("playBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const songTitleEl = document.getElementById("songTitle");
      const progress = document.getElementById("progress");
      const progressBar = document.getElementById("progressBar");
      const playerTime = document.getElementById("playerTime");
      const volumeSlider = document.getElementById("volume");
      const trackListEl = document.getElementById("trackList");
      const drawerSubEl = document.getElementById("drawerSub");

      const songs = [
        { id: "Yq4GkZAxWQw", title: "Heera Samdhani" },
        { id: "43MGWGyzBlM", title: "बसंती छोरी" },
        { id: "W02yu-FdlGM", title: "लाली हो लाली होसिया" },
        { id: "uTzxjYwdYpY", title: "गोरी मुखड़ी सजिली" },
        { id: "Ykah-TmdweU", title: "ओ बाना ललिता" },
        { id: "xNGRsnAexA8", title: "लबरा छोरी" },
        { id: "cjaw_GlWuso", title: "नैनीताले की माधुली" },
        { id: "FVZc8rLpp6Q", title: "बेडु पाको बारो मासा" },
        { id: "L8UFkhWpCs0", title: "बेडु पाको (Revoic & Suneet Rawat)" },
        { id: "AJ9uTlRiomA", title: "बेडु पाको (Suneet Rawat)" },
        { id: "E-1T4WhZFj0", title: "बेडु पाको" },
        { id: "SAQe0L7RP30", title: "बेडु पाको बारामासा" },
        { id: "bDK657bDfKc", title: "बेडु पाको (Priyanka Negi)" },
        { id: "1VRIwhsBBZE", title: "बेडु पाको (Maithili Thakur)" },
        { id: "ijN3PK7j6PQ", title: "थल की बाजार" },
        { id: "h0omec2FVH8", title: "थल की बाजार (Dhol Remix)" },
        { id: "I3JeD5QvYUs", title: "घुघूती घुरों लागी मेरे मैत की" },
        { id: "dglSrBQGI38", title: "घुघूती घूर घूरा" },
        { id: "xhDr2p22dDA", title: "घूर घुघूती" },
        { id: "QuOVsqzdhj0", title: "घुघूती जैसी साँखी" },
        { id: "ByeWLHyuMMI", title: "घुघूती बासुती" },
        { id: "O_tWjS7xj7o", title: "हे रमिये" },
        { id: "VL5l3myKoTI", title: "दादु मेरी उलर्या जिकुड़ी" },
        { id: "ViZKcQR4C1k", title: "को रै होला चुन्याल" },
        { id: "vuPPC-MRLjM", title: "कां भलो कुमौं गढ़वाल" },
        { id: "S-Q8YOdkaIA", title: "क्वी त् बात होलि" },
        { id: "C0_aei93S6s", title: "थान्दो रे थान्दो" },
        { id: "G1UWr7cSAQI", title: "आईगे बसंत" },
        { id: "Le4U-MxRnkc", title: "मंगतू ठेकेदार" },
        { id: "gqL_QDCLctY", title: "मेरी बसंती" },
      ];
      let virtualTrackIndex = 0;

      if (drawerSubEl) {
        drawerSubEl.textContent = songs.length + " songs · tap to play";
      }

      // Shuffle queue: every song is played once before the queue reshuffles.
      let shuffleQueue = [];
      let shufflePosition = -1;

      function buildShuffleQueue(excludeIndex = -1) {
        shuffleQueue = songs.map((_, i) => i);

        // Fisher-Yates shuffle
        for (let i = shuffleQueue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
        }

        // Avoid starting a new shuffled cycle with the song that just played.
        if (
          shuffleQueue.length > 1 &&
          excludeIndex >= 0 &&
          shuffleQueue[0] === excludeIndex
        ) {
          const swapIndex = 1 + Math.floor(Math.random() * (shuffleQueue.length - 1));
          [shuffleQueue[0], shuffleQueue[swapIndex]] = [
            shuffleQueue[swapIndex],
            shuffleQueue[0],
          ];
        }

        shufflePosition = -1;
      }

      function getNextShuffledIndex() {
        if (shuffleQueue.length !== songs.length || shufflePosition >= shuffleQueue.length - 1) {
          buildShuffleQueue(virtualTrackIndex);
        }

        shufflePosition++;
        return shuffleQueue[shufflePosition];
      }

      function syncShufflePosition(index) {
        const position = shuffleQueue.indexOf(index);
        if (position !== -1) {
          shufflePosition = position;
        }
      }

      function renderPlaylist() {
        trackListEl.innerHTML = "";
        songs.forEach((song, i) => {
          const row = document.createElement("div");
          row.className =
            "track-row" + (i === virtualTrackIndex ? " active" : "");
          row.dataset.index = i;
          row.innerHTML = `
          <span class="track-num">${String(i + 1).padStart(2, "0")}</span>
          <span class="track-main">
            <div class="t-title">${song.title}</div>
            <div class="t-meta">Kumaoni folk · lok geet</div>
          </span>
          <span class="track-eq"><span></span><span></span><span></span></span>
        `;
          row.addEventListener("click", () => {
            loadTrack(i, true);
            closeDrawer();
          });
          trackListEl.appendChild(row);
        });
      }

      function highlightActiveTrack() {
        trackListEl.querySelectorAll(".track-row").forEach((row) => {
          row.classList.toggle(
            "active",
            Number(row.dataset.index) === virtualTrackIndex,
          );
        });
      }

      const playerDisc = document.getElementById("playerDisc");
      function updatePlayButton() {
        playBtn.textContent = isPlaying ? "⏸" : "▶";
        if (playerDisc) playerDisc.classList.toggle("spinning", isPlaying);
      }

      function togglePlay() {
        if (!playerReady || !ytPlayer) return;
        if (isPlaying) ytPlayer.pauseVideo();
        else ytPlayer.playVideo();
      }

      function loadTrack(index, autoplay = true) {
        if (!playerReady || !ytPlayer) return;
        virtualTrackIndex = (index + songs.length) % songs.length;
        syncShufflePosition(virtualTrackIndex);
        const track = songs[virtualTrackIndex];
        ytPlayer.loadVideoById(track.id);
        updateSongLabel();
        highlightActiveTrack();
        progressBar.style.width = "0%";
        document.querySelector("#playerTime .current").textContent = "00:00";
        duration = 180;
        updateDurationLabel();
        if (!autoplay) ytPlayer.pauseVideo();
      }

      function previousTrack() {
        loadTrack(virtualTrackIndex - 1);
      }
      function nextTrack() {
        loadTrack(getNextShuffledIndex());
      }
      function updateSongLabel() {
        songTitleEl.textContent = songs[virtualTrackIndex].title;
      }

      playBtn.addEventListener("click", togglePlay);
      prevBtn.addEventListener("click", previousTrack);
      nextBtn.addEventListener("click", nextTrack);

      progress.addEventListener("click", (event) => {
        if (!playerReady || !ytPlayer) return;
        const rect = progress.getBoundingClientRect();
        const ratio = Math.max(
          0,
          Math.min(1, (event.clientX - rect.left) / rect.width),
        );
        ytPlayer.seekTo(ratio * duration, true);
        progressBar.style.width = ratio * 100 + "%";
      });

      volumeSlider.addEventListener("input", () => {
        if (playerReady && ytPlayer)
          ytPlayer.setVolume(Number(volumeSlider.value));
      });

      const volBtn = document.getElementById("volBtn");
      const volWrap = document.getElementById("volWrap");

      function openVolume() {
        volWrap.classList.add("open");
        volBtn.classList.add("active");
        volBtn.setAttribute("aria-expanded", "true");
      }
      function closeVolume() {
        volWrap.classList.remove("open");
        volBtn.classList.remove("active");
        volBtn.setAttribute("aria-expanded", "false");
      }
      function toggleVolume() {
        if (volWrap.classList.contains("open")) closeVolume();
        else openVolume();
      }
      volBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleVolume();
      });
      document.addEventListener("click", (e) => {
        if (!volWrap.contains(e.target) && e.target !== volBtn) closeVolume();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeVolume();
      });

      const playlistToggle = document.getElementById("playlistToggle");
      const playlistDrawer = document.getElementById("playlistDrawer");
      const drawerBackdrop = document.getElementById("drawerBackdrop");
      const drawerClose = document.getElementById("drawerClose");

      function openDrawer() {
        playlistDrawer.classList.add("open");
        drawerBackdrop.classList.add("open");
        playlistToggle.setAttribute("aria-expanded", "true");
      }
      function closeDrawer() {
        playlistDrawer.classList.remove("open");
        drawerBackdrop.classList.remove("open");
        playlistToggle.setAttribute("aria-expanded", "false");
      }
      function toggleDrawer() {
        if (playlistDrawer.classList.contains("open")) closeDrawer();
        else openDrawer();
      }
      playlistToggle.addEventListener("click", toggleDrawer);
      drawerClose.addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDrawer();
      });

      const rewindOverlay = document.getElementById("rewindOverlay");
      function rewindEffect() {
        if (!playerReady || !ytPlayer) return;
        rewindOverlay.classList.remove("active");
        void rewindOverlay.offsetWidth;
        rewindOverlay.classList.add("active");
        ytPlayer.seekTo(0, true);
        progressBar.style.width = "0%";
        document.querySelector("#playerTime .current").textContent = "00:00";
      }

      window.addEventListener("keydown", (event) => {
        if (
          event.key.toLowerCase() === "r" &&
          !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)
        )
          rewindEffect();
        if (event.code === "Space") {
          const activeTag = document.activeElement?.tagName;
          if (activeTag !== "INPUT" && activeTag !== "TEXTAREA") {
            event.preventDefault();
            togglePlay();
          }
        }
      });

      renderPlaylist();
      updatePlayButton();
    </script>
  </body>
</html>
